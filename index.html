<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Tablet</title>
<style>
:root{
  --navy:#1B3A63; --blue-accent:#2E6FB5; --bg:#D5D8DC; --card:#fff;
  --text:#1F2937; --muted:#6B7280; --border:#E2E5E9;
  --good:#1E8E5A; --warn:#C0392B; --amber:#B7791F;
  --green-dim:#E7F5EC; --red-dim:#FBEAEA; --amber-dim:#F6ECD9;
  --panel2:#F7F9FB; --mono:Consolas,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px;padding-top:4.76mm}
.wrap{max-width:1180px;margin:0 auto}
header{background:var(--navy);color:#fff;border-radius:10px;padding:10.5px 26px;margin-bottom:4.76mm;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;letter-spacing:.3px}
header .sub{font-size:12px;color:#B9C7D9;margin-top:4px}
.actions{display:flex;gap:10px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:7px;padding:10px 16px;font-size:12px;font-weight:600;transition:.15s}
.btn-primary{background:var(--blue-accent);color:#fff}.btn-primary:hover{background:#255a94}
.btn-export{background:#1E8E5A;color:#fff}.btn-export:hover{background:#166b44}
.btn-export:disabled{opacity:.6;cursor:default}
.btn-del{background:#F5E4E2;color:var(--warn);width:24px;height:24px;padding:0;font-size:13px;font-weight:700;line-height:1;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.btn-del:hover{background:#eecdc9}
.btn-del:disabled{opacity:.5;cursor:default}
.btn-plain{background:#EEF1F4;color:var(--navy)}.btn-plain:hover{background:#E2E7EC}
.tab-bar{display:flex;align-items:center;gap:8px;margin-bottom:4.76mm}
.tab-btn{padding:9px 20px;background:#EEF1F4;color:var(--navy);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tab-btn.active{background:var(--navy);color:#fff}
.count{display:inline-block;margin-left:8px;font-size:12px;background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px}
.tab-btn.active .count{background:rgba(255,255,255,.22)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card,.summary-card{background:var(--card);border-radius:10px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2,.summary-card h2{margin:0 0 14px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input[type=text],input[type=number],select,textarea{
 width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;
 font-size:12px;font-family:inherit;color:var(--text);background:#fff
}
input:focus,select:focus,textarea:focus{outline:2px solid #BBD3EC;border-color:var(--blue-accent)}
.dropzone{border:2px dashed #A9BBD1;border-radius:8px;padding:16px 14px;text-align:center;color:var(--muted);font-size:12px;background:#F7F9FB;cursor:pointer}
.dropzone.drag{border-color:var(--blue-accent);background:#EAF2FA}
.dropzone img{max-width:100%;max-height:145px;border-radius:6px;margin-bottom:8px}
.dz-actions{display:flex;gap:8px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.dz-btn{background:#fff;color:var(--blue-accent);border:1px solid var(--blue-accent);padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600}
.dz-btn:hover{background:#EAF2FA}
.table-wrap{overflow:auto;max-height:600px;position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{background:#DCEAF7;color:var(--navy);text-align:left;padding:9px 10px;font-weight:700;border-bottom:2px solid #B9CFE8;position:sticky;top:0;z-index:2}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#F7F9FB}
.empty-row td{text-align:center;color:var(--muted);padding:30px;font-style:italic}
.photo-thumb{width:68px;height:23px;object-fit:contain;border-radius:6px;border:1px solid var(--border);background:#F7F9FB;cursor:pointer}
.photo-empty{width:68px;height:23px;border:1px dashed var(--border);border-radius:6px;background:#F7F9FB;display:flex;align-items:center;justify-content:center;color:#A0A8B3;font-size:8px}
#inventoryBody td{padding:4px 10px;text-align:center;vertical-align:middle;height:30px}
.chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;background:#EAF2FA;color:var(--blue-accent)}
.category-chip{background:#EEF1F4;color:var(--navy)}
.top-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}
.top-row .field{flex:1;min-width:130px}.top-row label{margin-top:0}
.summary-section{display:none}.summary-pair{display:flex;gap:18px;flex-wrap:wrap}
.summary-card{flex:1 1 300px}.summary-number{font-size:34px;font-weight:700;color:var(--navy)}
.chart-legend-row{display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0}
.chart-legend-dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.chart-bar-row{margin-bottom:8px}
.chart-bar-track{background:#EEF1F4;border-radius:4px;height:10px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:4px}
.loc-cell{display:flex;align-items:center;gap:6px}
.loc-edit-btn{background:#EEF1F4;color:var(--navy);border:none;border-radius:5px;width:20px;height:20px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.loc-edit-btn:hover{background:#E2E7EC}
.loc-updated{font-size:10px;color:var(--muted);margin-top:2px}
.loc-edit-input{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;box-sizing:border-box}
.loc-edit-actions{display:flex;gap:4px;margin-top:4px}
.loc-btn-sm{border:none;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer}
.loc-save-btn{background:var(--navy);color:#fff}
.loc-cancel-btn{background:#EEF1F4;color:var(--navy)}
.stat-list{margin-top:12px}.stat-item{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:7px 0;font-size:12px}
.lock-notice{background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:12px;display:none}
  .btn-signoff{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);display:inline-flex;align-items:center;gap:6px;}
  .btn-signoff:hover{background:#255a94;}
  .btn-signoff:disabled{opacity:.5;cursor:default;background:#B9C7D9;border-color:#B9C7D9;color:#fff;}
  .btn-signoff svg{width:13px;height:13px;flex:0 0 auto;}
  .btn-confirm{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);}
  .btn-confirm:hover{background:#255a94;}
  .btn-approve{background:var(--green);color:#fff;border:1px solid var(--green);}
  .btn-approve:hover{background:#166b45;}
  .btn-notsign{background:var(--red);color:#fff;border:1px solid var(--red);}
  .btn-notsign:hover{background:#9c2e21;}
  .btn-cancel-plain{background:none;border:none;color:#B0B4BA;text-decoration:underline;padding:7px 10px;font-size:12px;font-weight:600;}
  .btn-cancel-plain:hover{color:#8A8F96;}
  .btn-unlock{background:#F1F2F4;color:var(--text);border:1px solid #E2E5E9;border-radius:999px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .btn-unlock:hover{background:#E7E9EC;}
  /* ===== Sign Status / Approval panel (ported from sign-status-approval-panel skill) ===== */
  .lock-notice{
    background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:8px 10px;
    font-size:12px;font-weight:600;margin-bottom:12px;
  }
  input:disabled,select:disabled,textarea:disabled{background:#F2F4F6;color:var(--muted);cursor:default;}
  .dropzone.locked{opacity:.6;}

  .status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-approved{background:var(--green-dim);color:var(--green);}
  .status-rejected{background:var(--red-dim);color:var(--red);}

  .approval-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .approval-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .sig-stamp img{height:42px;}
  .sig-meta{font-size:12px;color:var(--sub);line-height:1.5;font-family:var(--mono);}
  .sig-meta b{color:var(--text);font-family:inherit;}

  .confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}
  .confirm-box span{font-size:12px;color:var(--amber);font-weight:600;}
  .confirm-box input[type=password]{width:130px;}
  .confirm-box.reject-box{background:var(--red-dim);border-color:#f3c6c2;flex-direction:column;align-items:stretch;gap:8px;}
  .confirm-box.reject-box span{color:var(--red);}
  .confirm-box textarea{width:100%;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);resize:vertical;}
  .reject-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pw-error{font-size:12px;color:var(--red);font-weight:600;}
  .approval-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sign-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:10px;padding:20px;max-width:90vw;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-box img{display:block;border-radius:6px;max-width:none;max-height:none}
.delete-confirm-box{padding:26px 28px;min-width:320px;max-width:400px}
.delete-confirm-text{margin:0 0 22px;font-size:14px;color:var(--text);font-weight:500}
.delete-confirm-actions{display:flex;justify-content:flex-end;gap:10px}
.btn-confirm-no{background:#EEF1F4;color:var(--navy);border:none;border-radius:7px;padding:9px 20px;font-size:12px;font-weight:600;cursor:pointer}
.btn-confirm-no:hover{background:#E2E7EC}
.btn-confirm-yes{background:var(--warn);color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:12px;font-weight:600;cursor:pointer}
.btn-confirm-yes:hover{background:#9c2e21}
footer{margin-top:16px;text-align:center;font-size:12px;color:#8592A3}
.small-note{font-size:11px;color:#94A3B8;margin-top:5px}

/* QA Dummy input sizing: all six fields are equal and 2/3 of photo width */
.card:first-child input[type="text"], .card:first-child select { width:56.6667%; }


/* Right-side filters */
.search-wrap{position:relative;width:100%}
.search-wrap input{padding-left:34px!important}
.search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-52%);
  color:#7B8794;font-size:19px;line-height:1;pointer-events:none;font-weight:600
}
#filterBuyer,#filterCategory,#filterSize{width:100%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#btnRefresh.spinning{pointer-events:none;opacity:.75}
#btnRefresh .refresh-icon{display:inline-block}
#btnRefresh.spinning .refresh-icon{animation:qa-refresh-spin .5s linear}
.synced-badge{font-size:12px;font-weight:700;color:var(--good);opacity:0;transition:opacity .25s;display:inline-flex;align-items:center;gap:4px}
.synced-badge.show{opacity:1}
@keyframes qa-refresh-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ===== Tablet Info layout adjustments ===== */
.tablet-layout{grid-template-columns:28.5% 71.5%;gap:18px;align-items:stretch}
.left-stack{height:100%}
.left-stack .tablet-entry-card{height:100%;display:flex;flex-direction:column}
.tablet-entry-card{padding:20px}
.tablet-info-combined{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.tablet-info-combined .photo-panel{padding:10px}
.tablet-info-combined .photo-panel .dropzone{
  min-height:0;height:90px;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.tablet-info-combined .dropzone img{max-height:58px;margin-bottom:3px}
.tablet-info-combined .dz-actions{margin:3px 0 0}
.tablet-info-combined .info-panel{flex:1;padding:12px}
.tablet-info-combined .form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.tablet-info-combined .form-grid label{margin-top:7px;margin-bottom:4px}
.tablet-info-combined input[type=text],
.tablet-info-combined select{padding:7px 9px}
.right-stack{height:100%;min-width:0}
.right-stack>.card{margin-top:0!important;flex:1 1 0;display:flex;flex-direction:column;min-height:0;min-width:0}
.right-stack .table-wrap{flex:1;min-height:0;max-height:none;min-width:0}
@media(max-width:900px){
  .tablet-layout{grid-template-columns:1fr}
  .left-stack,.right-stack{height:auto}
  .right-stack>.card{flex:0 0 auto}
  .right-stack .table-wrap{max-height:400px}
}


/* ===== User requested Tablet Info layout ===== */
.tablet-info-combined .photo-panel .dropzone{
  height:90px;
}
.tablet-info-combined .dz-actions{
  flex-wrap:nowrap;
  width:100%;
  gap:6px;
}
.tablet-info-combined .dz-btn{
  padding:6px 8px;
  font-size:11px;
  white-space:nowrap;
  flex:1 1 0;
  min-width:0;
}

/* Tablet Info field layout */
.tablet-info-combined .info-panel .form-grid{
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:0 18px;
}
.tablet-info-combined .info-panel .form-grid > div:nth-child(1){grid-column:1;grid-row:1;} /* Team */
.tablet-info-combined .info-panel .form-grid > div:nth-child(2){grid-column:2;grid-row:1;} /* Code */
.tablet-info-combined .info-panel .form-grid > div:nth-child(3){grid-column:1;grid-row:2;} /* Brand */
.tablet-info-combined .info-panel .form-grid > div:nth-child(4){grid-column:2;grid-row:2;} /* Model */
.tablet-info-combined .info-panel .form-grid > div:nth-child(5){grid-column:1;grid-row:3;} /* Purpose */
.tablet-info-combined .info-panel .form-grid > div:nth-child(6){grid-column:2;grid-row:3;} /* Status */
.tablet-info-combined .info-panel .form-grid > div:nth-child(7){grid-column:1 / -1;grid-row:4;} /* Location */

.tablet-info-combined .info-panel .form-grid > div:nth-child(1) select,
.tablet-info-combined .info-panel .form-grid > div:nth-child(3) select,
.tablet-info-combined .info-panel .form-grid > div:nth-child(4) select,
.tablet-info-combined .info-panel .form-grid > div:nth-child(5) select,
.tablet-info-combined .info-panel .form-grid > div:nth-child(7) input{
  width:100%;
}


/* Tablet Info dropdown placeholders */

async function gsRun(fnName, ...args){
  // Gọi Apps Script Web App qua fetch() — dùng Content-Type: text/plain để tránh

  });

function resizeImage(file,scale=0.95,quality=0.95){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=r.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });

function normalizeTeamText(v){

function extractTeamFromOcr(text){
  const tokens=String(text||'').split(/\s+/).map(t=>t.trim()).filter(Boolean);
  if(!tokens.length)return '';
  const first=tokens[0].replace(/^[^\w&]+|[^\w&]+$/g,'');
  if(!first)return '';
  return normalizeTeamText(first);

function generateTabletCode(team){
  if(!team)return '';
  const prefix=team;
  const re=new RegExp('^'+prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)$');
  let max=0;
  state.tablets.forEach(x=>{
    const m=String(x.code||'').match(re);
    if(m)max=Math.max(max,parseInt(m[1],10)||0);
  });
  return prefix+'-'+String(max+1).padStart(2,'0');
}
function updateGeneratedCode(){
  const el=$('fCode');

    el.value=generateTabletCode($('fTeam').value);

  }

  const enteredCode=$('fCode').value.trim();
  const brand=$('fBrand').value,model=$('fModel').value,purpose=$('fPurpose').value;
  if(!team||!brand||!model||!purpose){return alert('Please complete Team, Brand, Model and Purpose.');}
  const code=enteredCode||generateTabletCode(team);
  const localImage=state.image;
  const x={id:Date.now().toString(),team:team,code:code,brand:brand,model:model,purpose:purpose,image:localImage,status:'Own',reason:''};
  state.tablets.push(x);state.image=null;
  ['fTeam','fCode'].forEach(id=>$(id).value='');$('fCode').dataset.autoGenerated='true';
  ['fBrand','fModel','fPurpose'].forEach(id=>$(id).selectedIndex=0);
  ['fBrand','fModel','fPurpose'].forEach(id=>updateTabletSelectPlaceholder($(id)));
  preview();save();render();

    trackOp(gsRun('uploadImage',localImage,(code||'tablet')+'_'+Date.now()+'.jpg'))
      .then(uploaded=>{
        if(uploaded&&uploaded.url){

        showToast('⚠ Không tải được ảnh lên server, ảnh vẫn hiển thị cục bộ');
      });
  }
}
function formatLogDateHeader(date){if(!date)return '';const parts=String(date).split('-');if(parts.length!==3)return date;return `${Number(parts[0])}/${Number(parts[1])}/${Number(parts[2])}`;}
function normalizeLogDates(){
  const dates=new Set((state.logDates||[]).filter(Boolean));
  (state.logs||[]).forEach(x=>{if(x&&x.date)dates.add(x.date);});
  state.logDates=Array.from(dates).sort();
}
function migrateLegacyLogs(){
  normalizeLogDates();
  const grid=state.logGrid||{};
  (state.logs||[]).forEach(x=>{
    if(!x||!x.code||!x.date)return;
    const key=x.code+'|'+x.date;
    if(grid[key]!==undefined)return;
    const pieces=[];
    if(x.io)pieces.push(x.io==='Check-Out'?'x':'o');
    if(x.team)pieces.push('→ '+x.team);
    if(x.by)pieces.push('· '+x.by);
    if(x.remark)pieces.push(x.remark);
    grid[key]=pieces.join(' ');
  });
  state.logGrid=grid;
}
function renderLogs(){
  migrateLegacyLogs();
  const head=$('logHead'),body=$('logBody');
  const dates=state.logDates||[];
  head.innerHTML='<tr><th>No.</th><th>Team</th><th>Tablet Code</th><th>Status</th><th>Reason</th>'+dates.map(d=>`<th data-date="${esc(d)}">${esc(formatLogDateHeader(d))}</th>`).join('')+'</tr>';
  const tablets=state.tablets||[];
  const cellsWrap=(x,d)=>{const key=x.code+'|'+d;const val=state.logGrid[key]??'';return `<td class="grid-cell"><input class="log-cell-input" data-code="${esc(x.code)}" data-date="${esc(d)}" value="${esc(val)}" placeholder="o"></td>`};
  body.innerHTML=tablets.length?tablets.map((x,i)=>{
    const cells=dates.map(d=>cellsWrap(x,d)).join('');
    const reasonOptions=['Real-Time','Final Insp','-'].map(v=>`<option value="${esc(v)}" ${x.reason===v?'selected':''}>${esc(v)}</option>`).join('');
    return `<tr><td>${i+1}</td><td>${esc(x.team)}</td><td class="code-cell">${esc(x.code)}</td><td><span class="chip ${x.status==='Transfer'?'out-chip':''}">${esc(x.status||'')}</span></td><td><select class="log-reason-select" data-id="${x.id}" ${x.reason?'disabled':''}><option value="" ${!x.reason?'selected':''}>Select</option>${reasonOptions}</select></td>${cells}</tr>`;
  }).join(''):`<tr class="empty-row"><td colspan="${5+dates.length}">No tablet records found.</td></tr>`;
  function applyLogCellValue(code,date,value){
    const key=code+'|'+date;
    state.logGrid[key]=value;
    const t=state.tablets.find(x=>x.code===code);
    if(t){
      const matches=String(value||'').match(/\b[ox]\b/gi);
      const flag=matches&&matches.length?matches[matches.length-1].toLowerCase():null;
      if(flag==='x')t.status='Transfer';
      else if(flag==='o')t.status='Own';
    }
    ensurePendingBatch('QA Tablet In-Out Log update');
    save();
    render();
  }
  body.querySelectorAll('.log-cell-input').forEach(el=>{
    el.addEventListener('change',()=>{applyLogCellValue(el.dataset.code,el.dataset.date,el.value);});
  });
  body.querySelectorAll('.log-reason-select').forEach(el=>{
    el.addEventListener('change',()=>{
      const t=state.tablets.find(x=>x.id===el.dataset.id);
      if(t){t.reason=el.value;ensurePendingBatch('QA Tablet In-Out Log update');save();render();}
    });
  });
}
function addLogDate(){
  const date=$('logColumnDate').value;
  if(!date)return alert('Please select a date.');
  if((state.logDates||[]).includes(date))return alert('This date column already exists.');
  state.logDates.push(date);

// ===== Summary charts: QA Tablet by Team / Own vs Transfer vs Be Transferred =====
if(typeof Chart!=='undefined'&&typeof ChartDataLabels!=='undefined'){Chart.register(ChartDataLabels);}
function teamOrder(){
  const seen=[];
  (state.tablets||[]).forEach(t=>{const team=(t.team||'').trim()||'—';if(!seen.includes(team))seen.push(team);});
  return seen;
}
function latestLogDate(){const dates=state.logDates||[];return dates.length?dates[dates.length-1]:null;}
function computeTeamStats(){
  const stats={};
  const ensure=team=>{if(!stats[team])stats[team]={total:0,own:0,transfer:0,beTransferred:0};return stats[team];};
  const latestDate=latestLogDate();
  (state.tablets||[]).forEach(t=>{
    const team=(t.team||'').trim()||'—';
    const s=ensure(team);
    s.total++;
    const cellVal=latestDate?String(state.logGrid[t.code+'|'+latestDate]||''):'';
    const matches=cellVal.match(/\b[ox]\b/gi);
    const flag=matches&&matches.length?matches[matches.length-1].toLowerCase():null;
    const isTransfer=flag==='x'||(!flag&&t.status==='Transfer');
    if(isTransfer){
      s.transfer++;
      const m=cellVal.match(/\(([^)]+)\)/);
      const destRaw=m&&m[1]?m[1].trim():'';
      const dest=destRaw?normalizeTeamText(destRaw):'';
      if(dest&&dest!==team)ensure(dest).beTransferred++;
    }else{
      s.own++;
    }
  });
  return stats;
}
let _chartByTeam=null,_chartOwnTransfer=null;
function renderCharts(){
  if(typeof Chart==='undefined')return;
  const detailEl=$('sectionDetail');

  const totals=teams.map(t=>stats[t].total);
  const own=teams.map(t=>stats[t].own);
  const transfer=teams.map(t=>stats[t].transfer);
  const beTransferred=teams.map(t=>stats[t].beTransferred);
  const labelOpts={color:'#1B3A63',font:{weight:'700',size:12},display:c=>c.dataset.data[c.dataIndex]>0};
  const c1=$('chartByTeam');

    _chartByTeam=new Chart(c1.getContext('2d'),{
      type:'bar',
      data:{labels:teams,datasets:[{label:'QA Tablet',data:totals,backgroundColor:'#2E7BF0',borderRadius:4,maxBarThickness:56}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},datalabels:Object.assign({anchor:'end',align:'top'},labelOpts)},scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#EEF1F4'}},x:{grid:{display:false}}}}
    });
  }
  const c2=$('chartOwnTransfer');
  if(c2){
    if(_chartOwnTransfer)_chartOwnTransfer.destroy();
    _chartOwnTransfer=new Chart(c2.getContext('2d'),{
      type:'bar',
      data:{labels:teams,datasets:[
        {label:'Own',data:own,backgroundColor:'#1E8E5A',stack:'s',maxBarThickness:56},
        {label:'Transfer',data:transfer,backgroundColor:'#E8B33D',stack:'s',maxBarThickness:56},
        {label:'Be Transferred',data:beTransferred,backgroundColor:'#8C52FF',stack:'s',maxBarThickness:56}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:12}}},datalabels:Object.assign({anchor:'end',align:'end'},labelOpts)},scales:{y:{beginAtZero:true,stacked:true,ticks:{precision:0},grid:{color:'#EEF1F4'}},x:{stacked:true,grid:{display:false}}}}
    });
  }
}

function fmtSignDateTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d.getTime()))return String(iso);const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function buildApprovalLeftHtml(){const b=currentBatch()||latestBatch();if(!b)return `<span class="status-badge status-pending">● PENDING SIGN-OFF</span><span style="font-size:12px;color:var(--muted);">QA Senior Manager: Kim Joo Shik</span>`;if(b.status==='SIGNED'){return `<span class="status-badge status-approved">✓ SIGNED OFF</span><div class="sig-stamp"><img src="${SIG_IMG}" alt="Signature"><div class="sig-meta"><b>${esc(b.approvedBy||APPROVER_NAME)}</b><span>${fmtSignDateTime(b.approvedAt)}</span><input class="sig-comment-input" data-id="${b.id}" value="${esc(b.comment||'')}" placeholder="Add comment..."></div></div>`}if(b.status==='NOT SIGNED'){return `<span class="status-badge status-rejected">✗ NOT SIGNED</span><div class="sig-stamp"><img src="${SIG_IMG}" alt="Signature"><div class="sig-meta"><b>${esc(b.rejectedBy||APPROVER_NAME)}</b><span>${fmtSignDateTime(b.rejectedAt)}</span><input class="sig-comment-input" data-id="${b.id}" value="${esc(b.comment||'')}" placeholder="Add comment..."></div></div>`}return `<span class="status-badge status-pending">● PENDING SIGN-OFF</span><span style="font-size:12px;color:var(--muted);">QA Senior Manager: ${esc(APPROVER_NAME)}</span>`;}
function buildApprovalRightHtml(){const pending=currentBatch(),latest=latestBatch(),ui=state.signUI;if(!pending&&!latest)return `<button class="dz-btn btn-signoff" id="signOffBtn" disabled>✎ Sign-Off</button>`;if(!pending&&latest)return `<button class="dz-btn btn-nextsignoff" id="nextSignOffBtn">↻ Next Sign-Off</button>`;const b=pending;if(ui.confirmingSign)return `<div class="confirm-box"><span>Enter password for sign-off</span><input type="password" id="pwField" value="${esc(ui.pwInput)}"><button class="dz-btn btn-confirm" id="signYes">Confirm</button><button class="dz-btn btn-cancel-plain" id="signNo">Cancel</button>${ui.pwError?`<span class="pw-error">${esc(ui.pwError)}</span>`:''}</div>`;if(ui.confirmingApprove)return `<div class="confirm-box reject-box"><span>Comment for update</span><textarea id="approveCommentField" placeholder="Enter comment...">${esc(ui.commentInput)}</textarea><div class="reject-actions"><button class="dz-btn btn-approve" id="approveYes">Submit</button><button class="dz-btn btn-cancel-plain" id="approveCancelBtn">Cancel</button></div></div>`;if(ui.confirmingReject)return `<div class="confirm-box reject-box"><span>Reason for not signing update #${b.no}:</span><textarea id="rejectCommentField" placeholder="Enter comment...">${esc(ui.commentInput)}</textarea><div class="reject-actions"><button class="dz-btn" id="rejectYes">Submit</button><button class="dz-btn btn-cancel-plain" id="rejectCancelBtn">Cancel</button></div>${ui.pwError?`<span class="pw-error">${esc(ui.pwError)}</span>`:''}</div>`;if(ui.showSignOffActions)return `<div class="approval-actions"><button class="dz-btn btn-approve" id="approveBtn">Approved</button><button class="dz-btn btn-notsign" id="notSignBtn">Not Sign w/Comment</button><button class="dz-btn btn-cancel-plain" id="cancelActionBtn">Cancel</button></div>`;return `<button class="dz-btn btn-signoff" id="signOffBtn">✎ Sign-Off</button>`;}
